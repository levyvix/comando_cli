name: Bump Version

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (manual override)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-version:
    # Avoid loops from the bot's own bump commit
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: bump version to v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine bump type
        id: bump_type
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump=${{ github.event.inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          MESSAGES=$(git log --format=%s%n%b $RANGE)

          if echo "$MESSAGES" | grep -Eq 'BREAKING CHANGE|^[a-zA-Z]+(\(.+\))?!:'; then
            BUMP=major
          elif echo "$MESSAGES" | grep -Eq '^feat(\(.+\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(python scripts/bump_version.py "${{ steps.bump_type.outputs.bump }}" | tail -n 1)
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/comando_cli/__init__.py

          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi

          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push
          git push origin "v${{ steps.bump.outputs.new_version }}"
